  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <linearGradient id="gA" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
        <symbol id="iconA" viewBox="0 0 64 64">
          <ellipse cx="32" cy="60" rx="13" ry="2.6" fill="#000" opacity=".18"/>
          <path d="M32 4C19.8 4 10 13.6 10 25.6 10 41 32 58 32 58s22-17 22-32.4C54 13.6 44.2 4 32 4Z" fill="url(#gA)"/>
          <path d="M20 27 43 15 35 38 31 30Z" fill="#fff"/>
          <path d="M31 30 43 15" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round"/>
        </symbol>
      </defs>
    </svg>

    <header class="top">
      <button class="brand" id="brand" type="button" aria-label="TripHelper">
        <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true"><use href="#iconA"/></svg>
        <span class="brand__word"><i>trip</i>helper</span>
      </button>
      <nav class="top__actions controls">
        <button id="theme-toggle" class="pill control-button" type="button" aria-label="다크 모드 전환">
          <span class="control-button__icon">🌙</span>
          <span class="control-button__text pill__text">다크 모드</span>
        </button>
        <button id="language-toggle" class="pill control-button" type="button" aria-label="언어 전환">
          <span class="control-button__icon">🌐</span>
          <span class="control-button__text pill__text">English</span>
        </button>
      </nav>
    </header>

    <!-- ① 첫 화면: 지구본 -->
    <section class="stage" id="stage">
      <div class="stage__copy">
        <p class="badge"><span aria-hidden="true">✦</span> AI POWERED TRAVEL CONCIERGE</p>
        <h1 data-i18n="hero.title">어디로 떠나시나요?</h1>
        <p class="stage__sub" data-i18n="hero.sub">지구본을 돌려 핀을 누르거나, 목적지를 검색하세요.</p>
        <form class="search" id="search-form" role="search">
          <label class="sr-only" for="search-input" data-i18n="search.label">여행지 검색</label>
          <input id="search-input" type="search" name="q" autocomplete="off" data-i18n-placeholder="search.placeholder" placeholder="예: 한국, 일본, 프랑스" />
          <button id="search-button" type="submit" data-i18n="search.button">검색</button>
        </form>
        <p class="search__msg" id="msg" role="status" aria-live="polite"></p>
        <div class="chips" id="chips" aria-label="인기 여행지"></div>
      </div>

      <figure class="globe-wrap">
        <svg id="globe" viewBox="0 0 800 800" role="img" aria-label="여행지를 선택할 수 있는 지구본"></svg>
        <figcaption data-i18n="globe.hint">드래그로 회전 · 핀을 눌러 선택</figcaption>
      </figure>
    </section>

    <!-- ② 결과: 에디토리얼 -->
    <main>
      <section class="paper results" id="result" aria-live="polite" hidden></section>
    </main>

    <footer class="foot footer">
      <p data-i18n="footer.text">© 2025 TripHelper. 여행의 모든 순간을 함께합니다.</p>
    </footer>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TripHelper",
      "alternateName": "여행 도우미",
      "description": "27개 국가 여행 정보 제공. 필수 매너, 기념품 추천, 현지 마트 추천템, 여행 필수템, 비자 정보, 필수 회화까지 한 곳에서 확인하세요.",
      "url": "https://triphelper.kr/",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KRW"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "ratingCount": "1"
      },
      "featureList": [
        "27개 국가 여행 정보",
        "필수 매너 & 팁",
        "기념품 추천",
        "현지 마트/약국 추천템",
        "여행 필수템",
        "비자 정보",
        "필수 회화",
        "환율 계산기",
        "날씨 정보",
        "한국어/영어 지원"
      ],
      "inLanguage": ["ko", "en"],
      "audience": {
        "@type": "Audience",
        "audienceType": "Travelers"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TripHelper",
      "url": "https://triphelper.kr/",
      "logo": "https://triphelper.kr/triphelper_image.png",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TripHelper",
      "url": "https://triphelper.kr/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://triphelper.kr/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "inLanguage": ["ko", "en"]
    }
    </script>
