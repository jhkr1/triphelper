  <body>
    <nav class="controls">

    <header class="hero">
      <div class="hero__content">
        <div class="hero__badge">
          <span class="hero__badge-icon">✦</span>
          <span class="hero__badge-text">AI Powered Travel Concierge</span>
        </div>
        <h1 class="sr-only">TripHelper</h1>
        <img
          class="hero__logo-image"
          src="Gemini_Generated_Image_vosqf0vosqf0vosq-Photoroom.png"
          alt="TripHelper 브랜드 로고"
          width="420"
          height="180"
          decoding="async"
          loading="eager"
          fetchpriority="high"
        />
        <p class="hero__tagline" data-i18n="hero.tagline">당신의 다음 여정을 위한 맞춤형 인사이트와 준비 리스트.</p>
        <p class="hero__subcopy" data-i18n="hero.subcopy">목적지를 검색하면 필수 매너부터 회화까지 한 곳에서 확인할 수 있어요.</p>
        <div class="search-box">
          <label class="sr-only" for="search-input" data-i18n="search.label">여행지 검색</label>
          <input
            id="search-input"
            type="search"
            data-i18n-placeholder="search.placeholder"
            placeholder="예: 한국, 일본, 프랑스"
            autocomplete="off"
          />
          <button id="search-button" type="button" data-i18n="search.button">검색</button>
        </div>
        <p class="hero__hint" data-i18n="hero.hint">Tip: 목적지를 입력하면 맞춤 정보를 보여드려요.</p>
      </div>

    <footer class="footer">
      <p data-i18n="footer.text">© 2025 TripHelper. 여행의 모든 순간을 함께합니다.</p>
    </footer>

    <template id="destination-template">
      <article class="destination">
        <header class="destination__header">
          <h2 class="destination__name">
            <span class="destination__flag" aria-hidden="true"></span>
            <span class="destination__country"></span>
          </h2>
          <p class="destination__summary"></p>
          <div class="destination__quick-info">
            <div class="quick-info__item quick-info__currency">
              <span class="quick-info__icon">💱</span>
              <div class="quick-info__content">
                <span class="quick-info__label" data-i18n="quickInfo.currency">통화</span>
                <span class="quick-info__value currency-info"></span>
              </div>
            </div>
          </div>
          <div class="currency-rate-container">
            <div class="currency-rate-header">
              <div class="currency-rate">
                <span class="currency-rate__label"></span>
                <span class="currency-rate__value"></span>
                <span class="currency-rate__unit"> KRW</span>
              </div>
              <div class="currency-rate-time">
                <span class="currency-rate-time__label" data-i18n="quickInfo.rateTime">기준 시간:</span>
                <span class="currency-rate-time__value"></span>
              </div>
            </div>
            <div class="currency-calculator">
              <div class="calculator-input-group">
                <input type="number" class="calculator-input" placeholder="" min="0" step="0.01" />
                <span class="calculator-currency-code"></span>
                <span class="calculator-equals">=</span>
                <span class="calculator-result"></span>
                <span class="calculator-result-unit"></span>
              </div>
            </div>
          </div>
          <div class="currency-chart-container" style="display: none;">
            <h4 class="currency-chart__title" data-i18n="quickInfo.exchangeRate">환율 추이</h4>
            <canvas class="currency-chart"></canvas>
          </div>
        </header>
        <div class="weather-section">
          <div class="weather-section__header">
            <h3 class="weather-section__title" data-i18n="quickInfo.weather">날씨</h3>
            <div class="weather-time">
              <span class="weather-time__label" data-i18n="quickInfo.localTime">현지 기준 시간:</span>
              <span class="weather-time__value"></span>
            </div>
          </div>
          <div class="weather-display"></div>
        </div>
        <div class="destination__info">
          <section class="info-card">
            <h3 data-i18n="sections.manners">필수 매너 &amp; 팁</h3>
            <ul class="info-list info-list--manners"></ul>
          </section>
          <section class="info-card">
            <h3 data-i18n="sections.souvenirs">꼭 사야 할 기념품</h3>
            <ul class="info-list info-list--souvenirs"></ul>
          </section>
          <section class="info-card">
            <h3 data-i18n="sections.market">현지 마트/약국 추천템</h3>
            <ul class="info-list info-list--market"></ul>
          </section>
          <section class="info-card">
            <h3 data-i18n="sections.essentials">여행 준비 필수템</h3>
            <ul class="info-list info-list--essentials"></ul>
          </section>
          <section class="info-card info-card--phrases">
            <h3 data-i18n="sections.phrases">필수 회화</h3>
            <ul class="phrase-list"></ul>
          </section>
        </div>
      </article>
    </template>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TripHelper",
      "description": "여행 준비를 위한 맞춤형 가이드: 필수 매너, 기념품, 현지 추천템, 필수 회화까지 한 곳에서 확인하세요.",
      "url": "https://triphelper.com/",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "KRW"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5",
        "ratingCount": "1"
      }
    }
    </script>
    <script src="script.js" defer></script>
